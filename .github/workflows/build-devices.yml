name: Build all devices

on:
  push:
    branches: ["main"]
    paths:
      - 'Common/**'
      - 'Platforms/**'
      - 'Resources/**'
      - 'Silicon/**'
      - 'build_active_devices.py'
      - 'build_uefi.py'
      - 'pip-requirements.txt'
      - '.github/workflows/build-devices.yml'
  pull_request:
    paths:
      - 'Common/**'
      - 'Platforms/**'
      - 'Resources/**'
      - 'Silicon/**'
      - 'build_active_devices.py'
      - 'build_uefi.py'
      - 'pip-requirements.txt'
      - '.github/workflows/build-devices.yml'
  workflow_dispatch:
    inputs:
      target:
        description: EDK2 build target
        required: true
        type: choice
        default: RELEASE
        options:
          - RELEASE
          - DEBUG

permissions:
  contents: read

env:
  BUILD_TARGET: ${{ github.event.inputs.target || 'RELEASE' }}
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build and package all devices
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acpica-tools \
            build-essential \
            clang \
            cmake \
            lld \
            llvm \
            nasm \
            python3 \
            python3-venv \
            python3-pip \
            uuid-dev
          python -m pip install -r pip-requirements.txt --break-system-packages

      - name: Build all devices
        run: |
          python3 build_active_devices.py \
            -r "${{ env.BUILD_TARGET }}" \
            -- -j "$(nproc)"

      - name: Upload UEFI images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uefi-images-${{ env.BUILD_TARGET }}
          path: out/*.img
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
