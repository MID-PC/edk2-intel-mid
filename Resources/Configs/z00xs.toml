# UEFI FD Configs
[uefi_fd]
base = 0x10F00000 # second bootloader entry point
size = 0x00400000

# Boot Image Configs
[boot_image]
format         = "android"
base           = 0x10000000
kernel_offset  = 0x00008000
ramdisk_offset = 0x01000000
second_offset  = 0x00F00000
tags_offset    = 0x00000100
pagesize       = 2048
header_version = 0
cmdline = 'init=/init pci=noearly console=logk0 loglevel=0 vmalloc=256M androidboot.hardware=mofd_v1 watchdog.watchdog_thresh=60 androidboot.spid=xxxx:xxxx:xxxx:xxxx:xxxx:xxxx androidboot.serialno=01234567890123456789 gpt snd_pcm.maximum_substreams=8 ptrace.ptrace_can_access=1 panic=15 ip=50.0.0.2:50.0.0.1::255.255.255.0::usb0:on debug_locks=0 n_gsm.mux_base_conf="ttyACM0,0 ttyXMM0,1" bootboost=1'

# Post-Processing Configs
[post]
# append Asus signature
append = ["sig"]
